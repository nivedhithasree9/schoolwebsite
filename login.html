<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<style>
:root {
    --ink: #1f2333;
    --brand: #7b2d26;
    --brand-dark: #5f221d;
    --accent: #234e52;
    --paper: rgba(255, 252, 246, 0.96);
    --line: rgba(31, 35, 51, 0.12);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: Georgia, "Times New Roman", serif;
    color: var(--ink);
    background:
        radial-gradient(circle at top, rgba(123, 45, 38, 0.24), transparent 24%),
        radial-gradient(circle at left, rgba(35, 78, 82, 0.16), transparent 22%),
        linear-gradient(180deg, #f7f1e7, #ede2d4);
}

.shell {
    width: min(560px, calc(100% - 24px));
}

.panel {
    border-radius: 28px;
    background: var(--paper);
    border: 1px solid var(--line);
    box-shadow: 0 24px 60px rgba(44, 31, 20, 0.12);
}

.panel {
    padding: 34px 28px;
}

.badge {
    display: inline-block;
    padding: 8px 14px;
    border-radius: 999px;
    background: rgba(123, 45, 38, 0.08);
    color: var(--brand);
    font-size: 0.82rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
}

h1 {
    margin: 18px 0 10px;
    font-size: clamp(2rem, 4vw, 3rem);
}

.lead {
    margin: 0 0 24px;
    line-height: 1.65;
}

label {
    display: block;
    margin-bottom: 6px;
    font-size: 0.95rem;
}

input {
    width: 100%;
    margin-bottom: 14px;
    padding: 12px 13px;
    border: 1px solid var(--line);
    border-radius: 14px;
    font: inherit;
}

.actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 8px;
}

.btn,
.btn-secondary {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 12px 16px;
    border: none;
    border-radius: 999px;
    text-decoration: none;
    cursor: pointer;
    font: inherit;
}

.btn {
    background: var(--brand);
    color: #fff;
}

.btn:hover {
    background: var(--brand-dark);
}

.btn-secondary {
    background: rgba(31, 35, 51, 0.06);
    color: var(--ink);
}

.btn-secondary:hover {
    background: rgba(31, 35, 51, 0.1);
}

.status {
    min-height: 24px;
    margin-top: 14px;
    text-align: center;
}

</style>
</head>
<body>
<div class="shell">
    <div class="panel">
        <span class="badge">Secure Admin Entry</span>
        <h1>Admin Login</h1>
        <p class="lead">Sign in to access dashboard analytics, search student records, and export admission data for presentation or review.</p>

        <label for="user">Username</label>
        <input id="user" placeholder="Username">

        <label for="pass">Password</label>
        <input id="pass" type="password" placeholder="Password">

        <div class="actions">
            <a class="btn-secondary" href="index.html">Back</a>
            <button class="btn" id="loginBtn" type="button">Login</button>
        </div>
        <div class="status" id="status"></div>
    </div>
</div>

<script src="api.js"></script>
<script>
function setStatus(message, isError = false) {
    const status = document.getElementById("status");
    status.textContent = message;
    status.style.color = isError ? "#a61b1b" : "#234e52";
}

async function login() {
    const username = document.getElementById("user").value.trim();
    const password = document.getElementById("pass").value.trim();

    if (!username || !password) {
        setStatus("Enter username and password.", true);
        return;
    }

    const button = document.getElementById("loginBtn");
    button.disabled = true;
    setStatus("Signing in...");

    try {
        const result = await apiRequest("/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ username, password })
        });

        setAdminToken(result.token);
        window.location.href = "admin.html";
    } catch (error) {
        clearAdminToken();
        setStatus(error.message || "Login failed.", true);
    } finally {
        button.disabled = false;
    }
}

document.getElementById("loginBtn").addEventListener("click", login);
document.getElementById("pass").addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
        login();
    }
});
</script>
</body>
</html>
